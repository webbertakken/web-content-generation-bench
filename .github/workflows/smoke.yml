name: Smoke build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable corepack
        run: corepack enable
      - name: Install
        run: yarn install --immutable
      - name: Run unit tests
        run: yarn test
      - name: Typecheck
        run: yarn typecheck
      - name: Generate small dataset (1 restaurant)
        run: yarn data:small
      - name: Build all apps
        run: yarn build
      - name: Bench harness (smoke)
        run: yarn workspace @bench/harness bench --scale 1 --runs 1
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: bench/results/
